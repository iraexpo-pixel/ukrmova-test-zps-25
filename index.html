const app=document.getElementById('app');
let order=[],i=0,ans=[];
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function start(){
 app.innerHTML=`<div class="start"><p>${Q.length} питань: мова і стилі, офіційно-діловий стиль, ДСТУ 4163:2020.</p><p>Після тесту побачиш свої помилки поруч із правильними відповідями.</p><button class="btn" id="go">Почати</button></div>`;
 document.getElementById('go').onclick=()=>{order=shuffle(Q.map((_,k)=>k)).map(k=>({k,opts:shuffle(Q[k][2].map((t,n)=>({t,n})))}));i=0;ans=[];show()};
}
function show(){
 const it=order[i],q=Q[it.k];let sel=null;
 app.innerHTML=`<div class="meta"><span>${q[0]}</span><span>${i+1} / ${order.length}</span></div><div class="bar"><i style="width:${i/order.length*100}%"></i></div><div class="q">${q[1]}</div>`+
 it.opts.map((o,n)=>`<button class="opt" data-n="${n}">${o.t}</button>`).join('')+`<button class="btn" id="nx" disabled>${i+1<order.length?'Далі':'Завершити'}</button>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{app.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.n;document.getElementById('nx').disabled=false});
 document.getElementById('nx').onclick=()=>{ans.push(it.opts[sel].n);i++;i<order.length?show():end()};
}
function end(){
 let ok=0,list='';
 order.forEach((it,n)=>{const q=Q[it.k];if(ans[n]===q[3])ok++;else list+=`<div class="m"><div class="mq">${q[1]}</div><div class="no">✗ ${q[2][ans[n]]}</div><div class="ok">✓ ${q[2][q[3]]}</div><div class="ex">${q[4]}</div></div>`});

 app.innerHTML=`<div class="score">${ok} / ${order.length}</div><p>${pct}% правильних відповідей</p>`+

 `<button class="btn ghost" id="re" style="margin-top:16px">Пройти ще раз</button>`;
